# Copier template: make a new project with
#   copier copy gh:Just-Sean/capy-project my-client-app
# and later pull in starter improvements from inside the project with
#   copier update

_min_copier_version: "9.4"
_subdirectory: template      # only files under template/ are copied into projects
# The project's own files: made once, then never changed by `copier update` (the project
# fills them in, and later template changes come as notes in the README's update notes).
_skip_if_exists:
  - templates/layout.html

project_name:
  type: str
  help: Human-readable project name
  default: My Project
  validator: >-
    {% if project_name | regex_search('[\x00-\x1f\x7f]') %}
    Use a name without tabs, line breaks or other control characters.
    {% endif %}

project_slug:
  type: str
  help: Lowercase identifier, used for the package and database name
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use lowercase letters, digits and underscores, starting with a letter.
    {% elif project_slug | length > 48 %}
    Use at most 48 characters: it's also the database name, and Postgres allows 63
    (the tests' database adds test_ in front, a restore's copy _before_restore after).
    {% endif %}
