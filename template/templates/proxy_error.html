<!doctype html>
<!--
  Not a Django template: the reverse proxy shows this file itself when Django doesn't
  answer (502, 503, 504), e.g. during a restart. So it's complete on its own, with
  nothing to load from the app.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Temporarily unavailable</title>
</head>
<body>
  <main>
    <h1>Temporarily unavailable</h1>
    <p>The site can't answer right now. Please try again in a few minutes.</p>
  </main>
</body>
</html>
