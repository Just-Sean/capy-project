# Local check only: runs production on this machine over plain HTTP at
# http://localhost:8000, so the HTTPS settings are switched off here instead of in
# .env.production, and Caddy answers any host name without a certificate. Never use it
# on a server. See "Production (the real image, run locally)" in the README:
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.local-http.yaml up --build
services:
  web:
    environment:
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
      DJANGO_SECURE_HSTS_SECONDS: "0"

  caddy:
    environment:
      SITE_ADDRESS: ":80"              # plain HTTP, any host name
    ports: !override
      - "127.0.0.1:8000:80"            # this machine only
